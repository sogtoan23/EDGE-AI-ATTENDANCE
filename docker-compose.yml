version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: face_attendance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: face_attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: face_attendance_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/face_attendance_db
      JWT_SECRET_KEY: ENTERPRISE_SECURE_TOKEN_2026_DA_NANG
    volumes:
      - ./snapshots:/app/snapshots
      - ./logs:/app/logs
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: face_attendance_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web

volumes:
  pgdata: